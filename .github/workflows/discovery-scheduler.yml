name: Discovery Scheduler

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: people
            workflow: people-sitemap.yml
          - source: bjnews
            workflow: bjnews-sitemap.yml
          - source: gmw
            workflow: gmw-sitemap.yml
          - source: cankaoxiaoxi
            workflow: cankaoxiaoxi-search.yml
    concurrency:
      group: discovery-scheduler-${{ matrix.source }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        env:
          SOURCE: ${{ matrix.source }}
          WORKFLOW: ${{ matrix.workflow }}
          DISPATCH_TOKEN: ${{ secrets.DISCOVERY_DISPATCH_TOKEN }}
        with:
          github-token: ${{ secrets.DISCOVERY_DISPATCH_TOKEN }}
          script: |
            const schedule = require('./.github/scripts/schedule-discovery.js');
            await schedule({ github, context, core, env: process.env });
