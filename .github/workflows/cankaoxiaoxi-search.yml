name: Cankaoxiaoxi Search Discovery and Extraction

on:
  workflow_dispatch:
    inputs:
      enforce_interval:
        description: "Run only if the previous search discovery started at least 24 hours ago"
        type: boolean
        default: false

concurrency:
  group: cankaoxiaoxi-search-discovery
  cancel-in-progress: false

jobs:
  discover-and-extract:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Check discovery interval
        id: interval
        uses: actions/github-script@v7
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SOURCE: cankaoxiaoxi
          JOB_TYPE: daily
          ENFORCE_INTERVAL: ${{ inputs.enforce_interval }}
        with:
          script: |
            const { isDue } = require('./.github/scripts/schedule-discovery.js');
            const due = process.env.ENFORCE_INTERVAL !== 'true' || await isDue({ env: process.env, fetch });
            core.setOutput('due', String(due));
            if (!due) core.notice('Skipping discovery: the previous run started less than 24 hours ago.');

      - uses: actions/setup-python@v5
        if: steps.interval.outputs.due == 'true'
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        if: steps.interval.outputs.due == 'true'
        run: pip install -r scraper/requirements.txt

      - name: Discover Cankaoxiaoxi search results
        id: discover
        if: steps.interval.outputs.due == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m scraper.cankaoxiaoxi_search_discovery

      - name: Extract pending Cankaoxiaoxi discoveries
        if: always() && steps.interval.outputs.due == 'true' && steps.discover.outcome != 'skipped' && steps.discover.outcome != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m scraper.scrape_pending --source cankaoxiaoxi
