name: People's Daily Article Extraction

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["People's Daily Sitemap Discovery"]
    types: [completed]

concurrency:
  group: people-scrape-pending
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  scrape:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check discovery actually ran
        id: discovery
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('ran', 'true');
              return;
            }
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              ...context.repo, run_id: context.payload.workflow_run.id, per_page: 100,
            });
            const step = data.jobs.flatMap(job => job.steps).find(step =>
              step.name === 'Discover sitemap article URLs'
            );
            if (!step || !['success', 'skipped'].includes(step.conclusion)) {
              throw new Error('Could not determine whether discovery ran successfully');
            }
            core.setOutput('ran', String(step.conclusion === 'success'));

      - uses: actions/checkout@v4
        if: steps.discovery.outputs.ran == 'true'

      - name: Set up Python
        if: steps.discovery.outputs.ran == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        if: steps.discovery.outputs.ran == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Scrape up to 1,000 pending sitemap discoveries
        if: steps.discovery.outputs.ran == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m scraper.scrape_pending --source people
