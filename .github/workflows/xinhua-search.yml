name: Xinhua Search Discovery and Extraction

on:
  schedule:
    - cron: "3 17 * * *"
  workflow_dispatch:

concurrency:
  group: xinhua-search-discovery
  cancel-in-progress: false

jobs:
  discover-and-extract:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt

      - name: Discover Xinhua search results
        id: discover
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m scraper.xinhua_search_discovery

      - name: Extract pending Xinhua discoveries
        if: always() && steps.discover.outcome != 'skipped' && steps.discover.outcome != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m scraper.scrape_pending --source xinhua
