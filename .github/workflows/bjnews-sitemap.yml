name: Beijing News Sitemap Discovery

on:
  workflow_dispatch:
    inputs:
      enforce_interval:
        description: "Run only if the previous sitemap crawl started at least 24 hours ago"
        type: boolean
        default: false

concurrency:
  group: bjnews-sitemap-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check discovery interval
        id: interval
        uses: actions/github-script@v7
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SOURCE: bjnews
          JOB_TYPE: daily
          ENFORCE_INTERVAL: ${{ inputs.enforce_interval }}
        with:
          script: |
            const { isDue } = require('./.github/scripts/schedule-discovery.js');
            const due = process.env.ENFORCE_INTERVAL !== 'true' || await isDue({ env: process.env, fetch });
            core.setOutput('due', String(due));
            if (!due) core.notice('Skipping discovery: the previous run started less than 24 hours ago.');

      - name: Set up Python
        if: steps.interval.outputs.due == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        if: steps.interval.outputs.due == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Discover Beijing News sitemap article URLs
        if: steps.interval.outputs.due == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m scraper.sitemap_discovery --source bjnews
